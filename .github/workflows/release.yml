name: Build and release

# Builds standalone, single-file executables for Windows, macOS and Linux so
# users can run cleanbrowse WITHOUT installing Python, then attaches them to a
# GitHub Release.
#
# To release: Actions > Build and release > Run workflow. The version box says "next"
# (last release + 1); type a number to choose one, or clear it to only test the build
# (binaries are then kept as run artifacts, nothing is published). Pushing a version
# tag (git tag v0.2.0 && git push origin v0.2.0) also makes a release.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. "next" = last release + 1 (for example 1.3 after 1.2), or type one (for example 2.0). Empty = only test the build, no release.'
        required: false
        default: 'next'

permissions:
  contents: write

jobs:
  version:
    # Works out the release version: from the Run workflow box ("next" = last release + 1)
    # or from a pushed v* tag. Empty means "only test the build, no release".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            if [ "$INPUT" = next ]; then
              last=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0] // ""')
              num=$(printf '%s' "$last" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
              if [ -z "$num" ]; then
                echo "::error::There is no release yet, so there is nothing to add 1 to. Run again and type the first version (for example 1.0)."; exit 1
              fi
              v=$(printf '%s' "$num" | awk -F. -v OFS=. '{$NF=$NF+1; print}')
              echo "Last release: ${last:-none}"
            else
              v="${INPUT#[vV]}"
            fi
          fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$v' is not a version number. Use numbers like 1.4 or 2.0.1, or 'next'."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "### Releasing v$v" >> "$GITHUB_STEP_SUMMARY"; else echo "### Test build only, no release" >> "$GITHUB_STEP_SUMMARY"; fi

  build:
    needs: version
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cleanbrowse-linux
          - os: macos-latest
            asset: cleanbrowse-macos
          - os: windows-latest
            asset: cleanbrowse-windows.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file executable
        run: pyinstaller --onefile --name cleanbrowse cleanbrowse.py

      - name: Rename for this OS (unix)
        if: runner.os != 'Windows'
        run: mv dist/cleanbrowse "dist/${{ matrix.asset }}"

      - name: Rename for this OS (windows)
        if: runner.os == 'Windows'
        run: Rename-Item dist/cleanbrowse.exe ${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Publish only when a version was given (Run workflow box or a pushed v* tag).
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: cleanbrowse ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
