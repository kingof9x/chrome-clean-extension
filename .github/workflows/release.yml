name: Release

# Builds standalone, single-file executables for Windows, macOS and Linux so
# users can run cleanbrowse WITHOUT installing Python, then attaches them to a
# GitHub Release.
#
# Triggers (any of these builds the binaries AND attaches them to the release):
#   1. Create a release in the GitHub UI ("Releases" -> "Draft a new release",
#      pick or create any tag, Publish). This is the easiest way.
#   2. Push a version tag from the CLI:
#          git tag v0.1.0
#          git push origin v0.1.0
#      (A release is created automatically for the tag.)
#   3. Run manually from the Actions tab (workflow_dispatch) to test the build
#      only -- binaries are kept as run artifacts, nothing is published.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cleanbrowse-linux
          - os: macos-latest
            asset: cleanbrowse-macos
          - os: windows-latest
            asset: cleanbrowse-windows.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file executable
        run: pyinstaller --onefile --name cleanbrowse cleanbrowse.py

      - name: Rename for this OS (unix)
        if: runner.os != 'Windows'
        run: mv dist/cleanbrowse "dist/${{ matrix.asset }}"

      - name: Rename for this OS (windows)
        if: runner.os == 'Windows'
        run: Rename-Item dist/cleanbrowse.exe ${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Publish for a UI-created release or a pushed tag; skip for manual test runs.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          # Target the release that triggered this run, or the pushed tag.
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
